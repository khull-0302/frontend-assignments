<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <h1>Welcome to the ATM</h1>

    <div class="login-section">
      <label for="email">Email:</label>
      <input type="text" id="email" required />
      <label for="password">Password</label>
      <input type="password" id="password" required />
      <button onclick="login()">Login</button>
      <p id="login-error" class="login-error error hidden">
        Inavlid email or password
      </p>
    </div>

    <div class="atm-menu hidden">
      <p class="user-greeting"></p>
      <p class="balance-display"></p>
      <button onclick="toggleTransactions('deposit')">Deposit Money</button>
      <button onclick="toggleTransactions('withdraw')">Withdrawl Money</button>
      <button onclick="logout()">Logout</button>
    </div>

    <div class="deposit-section hidden">
      <label for="deposit-amount">Enter Deposit Amount</label>
      <input type="number" id="deposit-amount" min="1" step="1" required />
      <button onclick="completeTransaction('deposit')">Complete Deposit</button>
      <button>Cancel</button>
      <p class="deposit-error error hidden">
        Please enter a valid depsoit amount
      </p>
    </div>

    <div class="withdraw-section hidden">
      <label for="withdraw-amount">Enter WithDraw Amount</label>
      <input type="number" id="withdraw-amount" min="1" step="1" required />
      <button onclick="completeTransaction('withdraw')">
        Complete Withdraw
      </button>
      <button>Cancel</button>
      <p class="withdraw-error error hidden">
        Please enter a valid withdraw amount
      </p>
    </div>

    <div class="transaction-history hidden">
      <h3>transaction history</h3>
      <ul class="transaction-list"></ul>
    </div>

    <div class="receipt-section hidden">
      <h2>transaction receipt</h2>
      <div class="receipt-display"></div>
    </div>

    <script src="./scripts/script.js"></script>
  </body>
</html>
