<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home | The Flying Cowboys</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css"
      integrity="sha512-SzlrxWUlpfuzQ+pcUCosxcglQRNAq/DZjVsC0lE40xsADsfeQoEypE+enwcOiGjk/bSuGGKHEyjSoQ1zVisanQ=="

      referrerpolicy="no-referrer"

    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <div class="nav-bar">
      <header>
        <nav>
          <div class="flying-cowboy-logo">
            <img
              src="./assets/flying-cowboy.jpg"
              width="70px"
              alt="flying-cowboy-logo"
            />
          </div>
        </nav>
      </header>
    </div>

    <div class="hero-section">
      <video autoplay muted loop src="./assets/flying-cowboys-vid.mp4"></video>
      <img src="./assets/flying-cowboy.jpg" alt="flying-cowboy-logo" />
    </div>

    <div class="mission-section">
      <div class="mission-content">
        <h1>OUR MISSION</h1>
        <!-- <img src="./assets/mission-emblem.jpg" alt="emblem" /> -->
        <p>
          The Flying Cowboys are a group of back country aviation enthusiasts
          striving to increase their skills while promoting general aviation

        </p>
      </div>
    </div>
    <div class="cowboy-planes"></div>
